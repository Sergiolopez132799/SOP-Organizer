<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Organizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #0f172a;
            --primary-mid: #1e293b;
            --primary-light: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-soft: #eff6ff;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --success: #10b981;
            --sidebar-w: 264px;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,.07);
            --shadow-lg: 0 10px 40px rgba(0,0,0,.1);
            --transition: .15s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── SVG Icon Helper ── */
        .icon-svg { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-svg svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .icon-svg.lg svg { width: 24px; height: 24px; }

        /* ── LOGIN ── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--primary);
            position: relative;
            overflow: hidden;
        }
        #login-screen::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,.15) 0%, transparent 70%);
            top: -200px; right: -100px;
        }
        #login-screen::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(59,130,246,.1) 0%, transparent 70%);
            bottom: -200px; left: -100px;
        }
        .login-box {
            background: var(--card);
            padding: 48px 44px;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 1;
        }
        .login-icon {
            width: 56px; height: 56px;
            background: var(--accent-soft);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .login-icon svg { width: 28px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .login-box h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -.02em;
        }
        .login-box .subtitle {
            color: var(--text-secondary);
            font-size: .875rem;
            margin-bottom: 32px;
        }
        .input-group { position: relative; text-align: left; }
        .input-group label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: .9rem;
            font-family: inherit;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            background: var(--bg);
        }
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }
        .login-btn {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: .9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
        }
        .login-btn:hover { background: var(--accent-hover); }
        .login-btn:active { transform: scale(.98); }
        .login-error {
            color: #ef4444;
            font-size: .8rem;
            margin-top: 14px;
            display: none;
        }

        /* ── APP SHELL ── */
        #app { display: none; }
        #app.active { display: flex; min-height: 100vh; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            transition: transform .25s ease;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-logo {
            width: 36px; height: 36px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sidebar-logo svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .sidebar-header .brand { flex: 1; }
        .sidebar-header .brand h2 {
            font-size: .9rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.01em;
            line-height: 1.2;
        }
        .sidebar-header .brand span {
            font-size: .7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 500;
        }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px; }
        .nav-label {
            padding: 16px 12px 6px;
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            cursor: pointer;
            border-radius: 8px;
            font-size: .855rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
            margin-bottom: 2px;
        }
        .nav-item:hover { background: var(--border-light); color: var(--text); }
        .nav-item.active {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .nav-item.active .icon-svg svg { stroke: var(--accent); }
        .nav-item .badge {
            margin-left: auto;
            font-size: .7rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--border-light);
            padding: 1px 8px;
            border-radius: 6px;
        }
        .nav-item.active .badge { background: rgba(59,130,246,.12); color: var(--accent); }

        .sidebar-footer {
            padding: 12px 8px;
            border-top: 1px solid var(--border-light);
        }
        .sidebar-footer .nav-item { color: var(--text-muted); font-size: .82rem; }
        .sidebar-footer .nav-item:hover { color: #ef4444; background: #fef2f2; }
        .sidebar-footer .nav-item:hover .icon-svg svg { stroke: #ef4444; }

        /* ── MAIN ── */
        .main {
            flex: 1;
            margin-left: var(--sidebar-w);
            padding: 32px 40px;
            max-width: 1000px;
        }

        .page-header { margin-bottom: 28px; }
        .page-header .breadcrumb {
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .page-header .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .page-header .breadcrumb a:hover { text-decoration: underline; }
        .page-header .breadcrumb .sep { color: var(--border); }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.02em;
            margin-top: 2px;
        }
        .page-header .page-desc {
            color: var(--text-secondary);
            font-size: .88rem;
            margin-top: 4px;
        }

        .header-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Search */
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            gap: 8px;
            min-width: 240px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,.1);
        }
        .search-bar svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .search-bar input {
            border: none;
            outline: none;
            font-size: .875rem;
            font-family: inherit;
            width: 100%;
            background: transparent;
            color: var(--text);
        }
        .search-bar input::placeholder { color: var(--text-muted); }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .stat-chip .stat-num {
            font-weight: 700;
            color: var(--text);
            font-size: .9rem;
        }

        /* Dept Grid */
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .dept-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .dept-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .dept-card .card-icon-wrap {
            width: 44px; height: 44px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .dept-card .card-icon-wrap svg { width: 22px; height: 22px; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .dept-card h3 {
            font-size: .95rem;
            font-weight: 650;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -.01em;
        }
        .dept-card p {
            font-size: .8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .dept-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
        }
        .dept-card .sop-count {
            font-size: .75rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .dept-card .card-arrow { color: var(--text-muted); transition: color var(--transition), transform var(--transition); }
        .dept-card .card-arrow svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .dept-card:hover .card-arrow { color: var(--accent); transform: translateX(2px); }

        /* Color accents per dept */
        .dept-pm .card-icon-wrap { background: #eff6ff; }
        .dept-pm .card-icon-wrap svg { stroke: #3b82f6; }
        .dept-ac .card-icon-wrap { background: #f0fdf4; }
        .dept-ac .card-icon-wrap svg { stroke: #22c55e; }
        .dept-hr .card-icon-wrap { background: #fef3c7; }
        .dept-hr .card-icon-wrap svg { stroke: #f59e0b; }
        .dept-ex .card-icon-wrap { background: #fae8ff; }
        .dept-ex .card-icon-wrap svg { stroke: #a855f7; }
        .dept-es .card-icon-wrap { background: #fef2f2; }
        .dept-es .card-icon-wrap svg { stroke: #ef4444; }

        /* SOP List */
        .sop-list { display: flex; flex-direction: column; gap: 8px; }
        .sop-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .sop-item:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
        }
        .sop-item .sop-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }
        .sop-item .sop-info { flex: 1; min-width: 0; }
        .sop-item .sop-info h4 {
            font-size: .88rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -.01em;
        }
        .sop-item .sop-info p {
            font-size: .78rem;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sop-item .sop-meta {
            font-size: .73rem;
            color: var(--text-muted);
            text-align: right;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* SOP Detail */
        .sop-detail {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px;
        }
        .sop-detail h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.02em;
            margin-bottom: 12px;
        }
        .sop-detail .meta-row {
            display: flex;
            gap: 20px;
            font-size: .78rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
        }
        .sop-detail .meta-row .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sop-detail .meta-row .meta-item svg { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .sop-detail .sop-body { font-size: .9rem; line-height: 1.85; color: var(--text); }
        .sop-detail .sop-body h3 {
            margin-top: 24px;
            margin-bottom: 8px;
            color: var(--text);
            font-size: .95rem;
            font-weight: 650;
            letter-spacing: -.01em;
        }
        .sop-detail .sop-body p { margin-bottom: 8px; color: var(--text-secondary); }
        .sop-detail .sop-body ol, .sop-detail .sop-body ul { padding-left: 20px; margin: 8px 0; }
        .sop-detail .sop-body li { margin-bottom: 6px; color: var(--text-secondary); }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .82rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 20px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all var(--transition);
        }
        .back-btn:hover { background: var(--border-light); color: var(--text); }
        .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Empty */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon-wrap {
            width: 56px; height: 56px;
            background: var(--border-light);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .empty-state .empty-icon-wrap svg { width: 24px; height: 24px; stroke: var(--text-muted); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .empty-state p { font-size: .88rem; }

        /* Mobile */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 14px; left: 14px;
            z-index: 200;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
            padding: 8px 10px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        .menu-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.3);
            z-index: 99;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-lg); }
            .sidebar.open { transform: translateX(0); }
            .sidebar.open + .sidebar-overlay { display: block; }
            .main { margin-left: 0; padding: 20px 16px; padding-top: 64px; }
            .menu-toggle { display: block; }
            .dept-grid { grid-template-columns: 1fr; }
            .stats-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-box">
        <div class="login-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <h1>SOP Organizer</h1>
        <p class="subtitle">Standard Operating Procedures Portal</p>
        <div class="input-group">
            <label for="pwd-input">Password</label>
            <input type="password" id="pwd-input" placeholder="Enter access password" autocomplete="off">
        </div>
        <button class="login-btn" onclick="checkPassword()">Sign In</button>
        <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
    </div>
</div>

<!-- APP -->
<button class="menu-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div id="app">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="brand">
                <h2>SOP Organizer</h2>
                <span>Construction Co.</span>
            </div>
        </div>
        <div class="sidebar-nav">
            <div class="nav-label">Main</div>
            <div class="nav-item active" onclick="showHome()" data-nav="home">
                <span class="icon-svg"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
                Dashboard
            </div>
            <div class="nav-label">Departments</div>
            <div id="nav-departments"></div>
        </div>
        <div class="sidebar-footer">
            <div class="nav-item" onclick="logout()">
                <span class="icon-svg"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                Sign Out
            </div>
        </div>
    </nav>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="main" id="main-content"></div>
</div>

<script>
// ── ICONS ──
const icons = {
    'project-management': '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    'accounting': '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    'human-resources': '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',

// ── AUTH ──
async function sha1(str) {
    const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPassword() {
    const pwd = document.getElementById('pwd-input').value;
    const hash = await sha1(pwd);
    if (hash === PASSWORD_HASH) {
        sessionStorage.setItem('sop_auth', '1');
        enterApp();
    } else {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('pwd-input').value = '';
        document.getElementById('pwd-input').focus();
    }
}
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
function logout() { sessionStorage.removeItem('sop_auth'); location.reload(); }
function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    buildNav();
    showHome();
}
if (sessionStorage.getItem('sop_auth')) enterApp();

}

    `;
}

function globalSearch(query) {
    const results = document.getElementById('search-results');
    if (!results) return;
    if (!query.trim()) { results.innerHTML = ''; return; }
    const q = query.toLowerCase();
    let matches = [];
    departments.forEach(d => {
        d.sops.forEach(s => {
            if (s.title.toLowerCase().includes(q) || s.summary.toLowerCase().includes(q))
                matches.push({ dept: d, sop: s });
        });
    });
    if (!matches.length) {
        results.innerHTML = '<div class="empty-state" style="padding:30px;"><p>No SOPs match your search.</p></div>';
    } else {
        results.innerHTML = `
            <p style="margin:24px 0 12px;font-size:.82rem;color:var(--text-muted);font-weight:500;">${matches.length} result(s)</p>
            <div class="sop-list">${matches.map(m => `
                <div class="sop-item" onclick="showSOP('${m.dept.id}','${m.sop.id}')">
                    <div class="sop-dot"></div>
                    <div class="sop-info">
                        <h4>${m.sop.title}</h4>
                        <p>${m.dept.name} — ${m.sop.summary}</p>
                    </div>
                </div>
            `).join('')}</div>
        `;
    }
}
