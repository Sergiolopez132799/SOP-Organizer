<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Organizer — Construction Company</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #1a2b4a;
            --primary-light: #2c4170;
            --accent: #d4a843;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #6b7c93;
            --border: #e2e6ec;
            --sidebar-w: 280px;
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* ───── PASSWORD GATE ───── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        }
        .login-box {
            background: var(--card-bg);
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-box h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .login-box p {
            color: var(--text-light);
            font-size: .9rem;
            margin-bottom: 28px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color .2s;
        }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }
        .login-box button:hover { background: var(--primary-light); }
        .login-error {
            color: #c0392b;
            font-size: .85rem;
            margin-top: 12px;
            display: none;
        }
        .login-logo {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        /* ───── APP SHELL ───── */
        #app { display: none; }
        #app.active { display: flex; min-height: 100vh; }

        /* ───── SIDEBAR ───── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--primary);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform .3s;
        }
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: .3px;
        }
        .sidebar-header span {
            font-size: .75rem;
            color: rgba(255,255,255,.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
        .nav-section {
            padding: 8px 20px 4px;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255,255,255,.35);
            margin-top: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background .15s;
            font-size: .9rem;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: rgba(255,255,255,.07); }
        .nav-item.active {
            background: rgba(255,255,255,.1);
            border-left-color: var(--accent);
        }
        .nav-item .icon { font-size: 1.1rem; width: 24px; text-align: center; }
        .nav-item .badge {
            margin-left: auto;
            background: var(--accent);
            color: var(--primary);
            font-size: .7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,.1);
            font-size: .8rem;
            color: rgba(255,255,255,.4);
        }
        .sidebar-footer a {
            color: rgba(255,255,255,.6);
            text-decoration: none;
            cursor: pointer;
        }
        .sidebar-footer a:hover { color: #fff; }

        /* ───── MAIN CONTENT ───── */
        .main {
            flex: 1;
            margin-left: var(--sidebar-w);
            padding: 32px 40px;
            max-width: 960px;
        }
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .main-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
        }
        .breadcrumb {
            font-size: .82rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }
        .breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* Search */
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 14px;
            gap: 8px;
            max-width: 300px;
        }
        .search-bar input {
            border: none;
            outline: none;
            font-size: .9rem;
            width: 100%;
            background: transparent;
        }

        /* Cards */
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .dept-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: box-shadow .2s, transform .15s;
        }
        .dept-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
            transform: translateY(-2px);
        }
        .dept-card .card-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .dept-card h3 { font-size: 1.05rem; color: var(--primary); margin-bottom: 4px; }
        .dept-card p { font-size: .82rem; color: var(--text-light); }
        .dept-card .sop-count {
            margin-top: 12px;
            font-size: .75rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        /* SOP List */
        .sop-list { margin-top: 16px; }
        .sop-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 22px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: box-shadow .2s;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .sop-item:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); }
        .sop-item .sop-icon { font-size: 1.4rem; }
        .sop-item .sop-info { flex: 1; }
        .sop-item .sop-info h4 { font-size: .95rem; color: var(--primary); }
        .sop-item .sop-info p { font-size: .8rem; color: var(--text-light); margin-top: 2px; }
        .sop-item .sop-meta {
            font-size: .75rem;
            color: var(--text-light);
            text-align: right;
            white-space: nowrap;
        }

        /* SOP Detail */
        .sop-detail {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-top: 16px;
        }
        .sop-detail h2 { font-size: 1.3rem; color: var(--primary); margin-bottom: 8px; }
        .sop-detail .meta-row {
            display: flex;
            gap: 24px;
            font-size: .8rem;
            color: var(--text-light);
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .sop-detail .meta-row span { display: flex; align-items: center; gap: 4px; }
        .sop-detail .sop-body { font-size: .92rem; line-height: 1.8; }
        .sop-detail .sop-body h3 { margin-top: 20px; margin-bottom: 8px; color: var(--primary); font-size: 1.05rem; }
        .sop-detail .sop-body ul, .sop-detail .sop-body ol { padding-left: 24px; margin: 8px 0; }
        .sop-detail .sop-body li { margin-bottom: 4px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .85rem;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .back-btn:hover { text-decoration: underline; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: .9rem; }

        /* Mobile */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 8px 12px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 24px 16px; padding-top: 60px; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="login-screen">

<!-- MAIN APP -->

<div id="app">

            <a onclick="logout()">&#128274; Lock &amp; Sign Out</a>
        </div>
    </nav>
    <div class="main" id="main-content"></div>
</div>

// ─── AUTH ────────────────────────────────────────────────────────────
async function sha1(str) {
    const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
    const pwd = document.getElementById('pwd-input').value;
    const hash = await sha1(pwd);
    if (hash === PASSWORD_HASH) {
        sessionStorage.setItem('sop_auth', '1');
        enterApp();
    } else {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('pwd-input').value = '';
        document.getElementById('pwd-input').focus();
    }
}

document.getElementById('pwd-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
});

function logout() {
    sessionStorage.removeItem('sop_auth');
    location.reload();
}

function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    buildNav();
    showHome();
}

// Auto-login if session exists
if (sessionStorage.getItem('sop_auth')) enterApp();

// ─── NAVIGATION ─────────────────────────────────────────────────────
function buildNav() {
    const container = document.getElementById('nav-departments');
    container.innerHTML = departments.map(d => `
        <div class="nav-item" onclick="showDepartment('${d.id}')" data-nav="${d.id}">
            <span class="icon">${d.icon}</span> ${d.name}
            <span class="badge">${d.sops.length}</span>
        </div>
    `).join('');
}

function setActiveNav(id) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const target = document.querySelector(`[data-nav="${id}"]`);
    if (target) target.classList.add('active');
    // Close mobile menu
    document.querySelector('.sidebar').classList.remove('open');
}

// ─── VIEWS ──────────────────────────────────────────────────────────
function showHome() {
    setActiveNav('home');
    const totalSOPs = departments.reduce((sum, d) => sum + d.sops.length, 0);
    document.getElementById('main-content').innerHTML = `
        <div class="main-header">
            <div>
                <div class="breadcrumb">Home</div>
                <h1>Dashboard</h1>
            </div>
            <div class="search-bar">
                <span>&#128269;</span>
                <input type="text" placeholder="Search SOPs..." oninput="globalSearch(this.value)">
            </div>
        </div>
        <p style="color:var(--text-light);margin-bottom:8px;">Welcome to the SOP Organizer. Select a department to view its standard operating procedures.</p>
        <p style="color:var(--text-light);font-size:.85rem;margin-bottom:24px;">${departments.length} Departments &middot; ${totalSOPs} Total SOPs</p>
        <div class="dept-grid">
            ${departments.map(d => `
                <div class="dept-card" onclick="showDepartment('${d.id}')">
                    <div class="card-icon">${d.icon}</div>
                    <h3>${d.name}</h3>
                    <p>${d.description}</p>
                    <div class="sop-count">${d.sops.length} SOPs</div>
                </div>
            `).join('')}
        </div>
        <div id="search-results"></div>
    `;
}

function showDepartment(deptId) {
    setActiveNav(deptId);
    const dept = departments.find(d => d.id === deptId);
    if (!dept) return;
    document.getElementById('main-content').innerHTML = `
        <div class="main-header">
            <div>
                <div class="breadcrumb"><a onclick="showHome()">Home</a> / ${dept.name}</div>
                <h1>${dept.icon} ${dept.name}</h1>
            </div>
        </div>
        <p style="color:var(--text-light);margin-bottom:20px;">${dept.description}</p>
        <div class="sop-list">
            ${dept.sops.length ? dept.sops.map(s => `
                <div class="sop-item" onclick="showSOP('${dept.id}','${s.id}')">
                    <div class="sop-icon">&#128196;</div>
                    <div class="sop-info">
                        <h4>${s.title}</h4>
                        <p>${s.summary}</p>
                    </div>
                    <div class="sop-meta">Revised: ${s.revised}</div>
                </div>
            `).join('') : `
                <div class="empty-state">
                    <div class="empty-icon">&#128194;</div>
                    <p>No SOPs have been added to this department yet.</p>
                </div>
            `}
        </div>
    `;
}

function showSOP(deptId, sopId) {
    const dept = departments.find(d => d.id === deptId);
    const sop = dept.sops.find(s => s.id === sopId);
    if (!sop) return;
    document.getElementById('main-content').innerHTML = `
        <div class="back-btn" onclick="showDepartment('${deptId}')">&#8592; Back to ${dept.name}</div>
        <div class="sop-detail">
            <h2>${sop.title}</h2>
            <div class="meta-row">
                <span>&#128197; Revised: ${sop.revised}</span>
                <span>&#128100; Author: ${sop.author}</span>
                <span>&#127970; Dept: ${dept.name}</span>
            </div>
            <div class="sop-body">${sop.body}</div>
        </div>
    `;
}

function globalSearch(query) {
    const results = document.getElementById('search-results');
    if (!results) return;
    if (!query.trim()) { results.innerHTML = ''; return; }
    const q = query.toLowerCase();
    let matches = [];
    departments.forEach(d => {
        d.sops.forEach(s => {
            if (s.title.toLowerCase().includes(q) || s.summary.toLowerCase().includes(q)) {
                matches.push({ dept: d, sop: s });
            }
        });
    });
    if (matches.length === 0) {
        results.innerHTML = `<div class="empty-state" style="padding:30px;"><p>No SOPs match "${query}"</p></div>`;
    } else {
        results.innerHTML = `
            <h3 style="margin:20px 0 12px;font-size:.95rem;color:var(--text-light);">${matches.length} result(s)</h3>
            <div class="sop-list">${matches.map(m => `
                <div class="sop-item" onclick="showSOP('${m.dept.id}','${m.sop.id}')">
                    <div class="sop-icon">&#128196;</div>
                    <div class="sop-info">
                        <h4>${m.sop.title}</h4>
                        <p>${m.dept.name} — ${m.sop.summary}</p>
                    </div>
                </div>
            `).join('')}</div>
        `;
    }
}
</script>
</body>
</html>
